<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorización de Instagram</title>
<style>body{font-family:system-ui,Segoe UI,sans-serif;background:#16161e;color:#eee;max-width:640px;margin:60px auto;padding:0 16px}code{display:block;background:#26262f;padding:14px;border-radius:8px;word-break:break-all;margin:12px 0}button{background:#C9A227;border:0;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer}</style></head>
<body><h2>Autorización de Instagram</h2><p id="m">Copiá este código y pegalo en la consola donde corre <b>instagram.py login</b>:</p><code id="c">(sin código)</code><button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent)">Copiar</button>
<script>const q=new URLSearchParams(location.search);const c=(q.get('code')||'').replace(/#_$/,'');if(c){document.getElementById('c').textContent=c}else{document.getElementById('m').textContent='No llegó ningún código: '+(q.get('error_description')||q.get('error')||'')}</script></body></html>
